<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sony TV Vibe — prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#f6f7ff;font-family:Inter,Segoe UI,Arial,sans-serif}main{min-height:100vh;padding:6vh 7vw;background:radial-gradient(ellipse at 85% 10%,#263252 0,transparent 55%),radial-gradient(ellipse at 5% 95%,#292342 0,transparent 55%),#0b1020}header{display:flex;justify-content:space-between;align-items:center;color:#c3cbe0;letter-spacing:3px;font-size:13px}h1{font-size:clamp(30px,4vw,58px);font-weight:500;margin:5vh 0 8px;letter-spacing:-2px}p{color:#aab5ce;margin:0 0 5vh}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 34px}.tile{height:clamp(120px,20vh,210px);border:3px solid transparent;border-radius:22px;color:white;font:600 clamp(20px,2.7vw,39px) Segoe UI,Arial;position:relative;box-shadow:0 12px 24px #0004;transition:transform .15s,border-color .15s;background:linear-gradient(135deg,#273858,#172239);cursor:pointer}.tile:focus{outline:none;border-color:#fff;transform:scale(1.045);box-shadow:0 0 0 5px #abbfff33,0 15px 35px #0007}.netflix{background:linear-gradient(135deg,#421923,#180e16);color:#ff3446;letter-spacing:2px}.youtube{background:linear-gradient(135deg,#4b2030,#281526)}.hotstar{background:linear-gradient(135deg,#173f81,#1c2156)}.prime{background:linear-gradient(135deg,#125675,#14314b)}.browser{background:linear-gradient(135deg,#345b74,#253448)}.media{background:linear-gradient(135deg,#544278,#2b2549)}small{display:block;font-size:12px;font-weight:400;letter-spacing:.5px;margin-top:12px;color:#e2e6f1}.badge{position:absolute;top:12px;right:14px;font-size:10px;background:#0004;padding:5px 8px;border-radius:12px;letter-spacing:1px}.utility{margin-top:30px;display:flex;gap:18px}.utility button{background:#ffffff0d;border:1px solid #ffffff30;color:#dbe3f7;padding:10px 16px;border-radius:22px}.utility button:focus{outline:3px solid white}footer{margin-top:25px;display:flex;justify-content:space-between;color:#aab5ce;font-size:12px}#notice{min-height:22px;color:#d6dff2;margin-top:20px} @media(prefers-reduced-motion:reduce){*{transition:none!important}} @media(max-width:600px){main{padding:30px}.grid{gap:18px}.tile{font-size:18px;height:125px}small{font-size:10px}footer{gap:15px}}
</style><main><header><span>SONY TV VIBE</span><span>HOME · PROTOTYPE</span></header><h1 id="title">Your evening. Your choice.</h1><p id="subtitle">Everything you watch, in one quiet place.</p><div class="grid" id="grid"></div><div class="utility"><button id="back" hidden>Back to Home</button><button id="voice">Voice search</button><button id="google">Google TV</button></div><div id="notice" role="status" aria-live="polite"></div><footer><span>↑ ↓ ← → Navigate &nbsp; · &nbsp; Enter Select &nbsp; · &nbsp; Esc Back</span><span>Local preview · no TV connection</span></footer></main><script>
const grid=document.getElementById('grid'),notice=document.getElementById('notice'),back=document.getElementById('back');let media=false;
const home=[['Netflix','netflix',''],['YouTube','youtube',''],['Hotstar','hotstar','Choose installed version on TV'],['Prime Video','prime',''],['Browser','browser','Target needs verification'],['Media','media','USB · Plex · VLC']];
const library=[['USB / Media player','browser','Target needs verification'],['Plex','prime','Your personal library'],['VLC','media','Play your media']];
function render(focus=0){grid.replaceChildren();document.getElementById('title').textContent=media?'Make yourself at home.':'Your evening. Your choice.';document.getElementById('subtitle').textContent=media?'Your files. Your library. Your favourites.':'Everything you watch, in one quiet place.';back.hidden=!media;(media?library:home).forEach(([label,cls,sub],i)=>{const b=document.createElement('button');b.className='tile '+cls;b.textContent=label;if(sub){const s=document.createElement('small');s.textContent=sub;b.append(s)}if(label==='Browser'||label==='USB / Media player'){const s=document.createElement('span');s.className='badge';s.textContent='UNRESOLVED';b.append(s)}b.onclick=()=>{if(label==='Media'){media=true;notice.textContent='';render()}else notice.textContent=(label==='Browser'||label==='USB / Media player')?'No activity has been verified. This target remains unavailable.':label+' selected — visual preview only.'};grid.append(b)});grid.children[focus].focus()}
back.onclick=()=>{media=false;notice.textContent='';render(5)};document.getElementById('voice').onclick=()=>notice.textContent='On TV: delegates to the system voice search handler when available.';document.getElementById('google').onclick=()=>notice.textContent='On TV: opens the existing Google TV launcher without changing the default.';
document.addEventListener('keydown',e=>{const tiles=[...grid.children],i=tiles.indexOf(document.activeElement);if(e.key==='Escape'&&media){back.click();return}if(i<0)return;let n=i;if(e.key==='ArrowRight')n=i%3<2?Math.min(i+1,tiles.length-1):i;else if(e.key==='ArrowLeft')n=i%3>0?i-1:i;else if(e.key==='ArrowDown'){if(i+3<tiles.length)n=i+3;else{(media?back:document.getElementById('voice')).focus();e.preventDefault();return}}else if(e.key==='ArrowUp')n=Math.max(0,i-3);else return;e.preventDefault();tiles[n].focus()});document.querySelector('.utility').addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();grid.lastElementChild.focus()}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.stopPropagation();const bs=[...document.querySelectorAll('.utility button')].filter(b=>!b.hidden),i=bs.indexOf(document.activeElement);bs[Math.max(0,Math.min(bs.length-1,i+(e.key==='ArrowRight'?1:-1)))].focus();e.preventDefault()}});render();
</script></html>
